<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{nama_lengkap}} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{nama_lengkap}}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_academic' %}">Academic Records</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{nama_lengkap}}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/fata.png" alt="Photo of {{Fata_Akhmad_Aulia}}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{bio}}.</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{npm}}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{study_program}}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/fata-aul" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/fata-akhmad-aulia" class="social-link">LinkedIn</a>
                        <a href="mailto:fataakhmad.aa@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{name}}. Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
